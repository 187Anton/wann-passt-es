<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Fehler')}"></head>
<body>

<a class="skip-link" href="#main">Zum Inhalt springen</a>
<header th:replace="~{fragments/layout :: header('none')}"></header>

<main id="main" class="page page--narrow">

    <section class="panel error-panel" aria-labelledby="error-title">
        <p class="status">
            Fehler <span th:text="${status}">404</span>
        </p>
        <h1 id="error-title"
            th:text="${title != null ? title : (status == 404 ? 'Seite nicht gefunden' : 'Es ist ein Fehler aufgetreten')}">
            Es ist ein Fehler aufgetreten
        </h1>

        <p class="error-panel__text" th:if="${message != null and message != ''}" th:text="${message}">
            Bitte gehe zurück zur Planung.
        </p>
        <p class="error-panel__text" th:if="${message == null or message == ''}">
            Diesen Schritt konnten wir nicht abschließen. Bitte gehe zurück zur
            Planung und versuche es erneut.
        </p>

        <div class="form-actions">
            <a class="btn btn--primary" th:href="@{/}">Zur Planung</a>
            <a class="btn btn--quiet" th:href="@{/profiles}">Zu den Suchprofilen</a>
        </div>
    </section>

</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>

</body>
</html>
