<!DOCTYPE html>
<html lang="de" th:replace="~{layout :: page('Planung', 'planning', ~{::content})}">
<body>
<th:block th:fragment="content">
    <div class="page-intro">
        <h1>Wetterfenster finden</h1>
        <a class="planning-jump" href="#planning-title">Suche anpassen</a>
    </div>

    <div class="planner">
        <section class="results" aria-labelledby="results-title">
            <header class="results-heading">
                <h2 id="results-title">Passende Zeitfenster</h2>
                <p class="results-context">
                    <strong th:text="${locationName}"></strong>
                    <span th:text="${selection.activity().label}"></span>
                </p>
            </header>
            <p th:if="${dateError}" class="status error" id="date-error" role="alert" th:text="${dateError}"></p>
            <p th:if="${weatherError}" class="status error" role="alert" th:text="${weatherError}"></p>
            <div th:if="${weatherError == null and dateError == null and #lists.isEmpty(suitableWindows)}" class="status empty">
                <h3>Keine passenden Zeitfenster</h3>
                <p>Versuche es mit einem anderen Zeitraum, einer kürzeren Mindestdauer oder weniger Wettervorgaben.</p>
            </div>
            <th:block th:unless="${#lists.isEmpty(suitableWindows)}">
                <p class="window-note">Uhrzeiten vor Ort</p>
                <ol class="window-list" role="list">
                    <li class="window" th:each="window : ${suitableWindows}">
                        <div class="window-start">
                            <span class="visually-hidden">Beginn</span>
                            <time th:datetime="${window.start()}">
                                <span class="window-date" th:text="${#temporals.format(window.start(), 'EEE, dd.MM.yyyy')}"></span>
                                <span class="window-time" th:text="${#temporals.format(window.start(), 'HH:mm')}"></span>
                            </time>
                        </div>
                        <div class="window-end">
                            <span class="visually-hidden">Ende</span>
                            <time th:datetime="${window.end()}">
                                <span class="window-date" th:text="${#temporals.format(window.end(), 'EEE, dd.MM.yyyy')}"></span>
                                <span class="window-time" th:text="${#temporals.format(window.end(), 'HH:mm')}"></span>
                            </time>
                        </div>
                        <div class="window-span">
                            <span class="visually-hidden">Dauer</span>
                            <span class="duration" th:text="${window.durationMinutes() + ' Min.'}"></span>
                        </div>
                    </li>
                </ol>
            </th:block>
        </section>

        <form id="planning-form" class="planning-form" th:action="@{/}" method="get" aria-labelledby="planning-title">
            <h2 id="planning-title" tabindex="-1">Einstellungen</h2>
            <div class="place">
                <div>
                    <span class="muted">Ort</span>
                    <strong th:text="${locationName}"></strong>
                </div>
                <button class="button secondary" type="submit" th:formaction="@{/locations}" formnovalidate>Ort ändern</button>
            </div>
            <input type="hidden" name="locationId" th:value="${selection.locationId()}">

            <div class="field-grid date-fields numeric">
                <div class="field">
                    <label for="startDate">Startdatum</label>
                    <input type="date" id="startDate" name="startDate"
                           th:value="${startDate}" th:min="${minSearchDate}" th:max="${maxSearchDate}"
                           th:attr="aria-invalid=${dateError != null ? 'true' : null},
                                    aria-describedby=${dateError != null ? 'date-error' : null}">
                </div>
                <div class="field">
                    <label for="endDate">Enddatum</label>
                    <input type="date" id="endDate" name="endDate"
                           th:value="${endDate}" th:min="${minSearchDate}" th:max="${maxSearchDate}"
                           th:attr="aria-invalid=${dateError != null ? 'true' : null},
                                    aria-describedby=${dateError != null ? 'date-error' : null}">
                </div>
            </div>

            <th:block th:replace="~{fields :: preferences(${selection.activity()}, ${selection.minDurationMinutes()},
                      ${selection.temperaturePreference()}, ${selection.windPreference()}, ${selection.precipitationPreference()})}"></th:block>

            <button class="button primary" type="submit" data-loading="Zeitfenster werden gesucht …">Zeitfenster suchen</button>
            <p class="status loading" data-form-status role="status"></p>

            <fieldset class="save-profile">
                <legend>Suchprofil speichern</legend>
                <p th:if="${profileError}" class="status error" id="profile-name-error" role="alert" th:text="${profileError}"></p>
                <div class="field">
                    <label for="profileName">Profilname</label>
                    <textarea id="profileName" name="profileName" rows="2" wrap="soft" th:text="${profileName}"
                              th:attr="aria-invalid=${profileError != null ? 'true' : null},
                                       aria-describedby=${profileError != null ? 'profile-name-error' : null}"></textarea>
                </div>
                <button class="button secondary" type="submit" th:formaction="@{/profiles}" formmethod="post">
                    Suchprofil speichern
                </button>
            </fieldset>
        </form>
    </div>
</th:block>
</body>
</html>
