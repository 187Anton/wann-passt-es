<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Wann passt es?</title>
</head>
<body>
<p><a th:href="@{/locations}">Ort suchen</a></p>
<p><a th:href="@{/profiles}">Gespeicherte Suchprofile</a></p>
<h2 th:text="${'Wettervorhersage für ' + locationName}"></h2>
<p>
    Daten von <a href="https://open-meteo.com/">Open-Meteo</a>.
    Die Bewertung verwendet vorläufige Beispielgrenzen.
</p>

<p th:if="${weatherError != null}"
   th:text="${weatherError}">
</p>
<p th:if="${profileError != null}"
   th:text="${profileError}">
</p>
<form th:action="@{/}" method="get">
    <input type="hidden"
           name="locationId"
           th:value="${locationId}">

    <label for="searchDate">Tag:</label>

    <input type="date"
           id="searchDate"
           name="searchDate"
           th:value="${searchDate}"
           th:min="${minSearchDate}"
           th:max="${maxSearchDate}"
           required>

    <label for="activity">Aktivität:</label>

    <select id="activity" name="activity">
        <option th:each="option : ${activities}"
                th:value="${option.name()}"
                th:text="${option.label}"
                th:selected="${option == activity}">
        </option>
    </select>

    <label for="minDurationMinutes">
        Mindestens benötigte Zeit in Minuten:
    </label>

    <input type="number"
           id="minDurationMinutes"
           name="minDurationMinutes"
           min="1"
           step="1"
           th:value="${minDurationMinutes}"
           required>
    <label for="precipitationPreference">Niederschlag:</label>

    <select id="precipitationPreference"
            name="precipitationPreference">
        <option th:each="preference : ${precipitationPreferences}"
                th:value="${preference.name()}"
                th:text="${preference.label}"
                th:selected="${preference == precipitationPreference}">
        </option>
    </select>
    <label for="temperaturePreference">Temperatur:</label>

    <select id="temperaturePreference" name="temperaturePreference">
        <option th:each="preference : ${temperaturePreferences}"
                th:value="${preference.name()}"
                th:text="${preference.label}"
                th:selected="${preference == temperaturePreference}">
        </option>
    </select>

    <label for="windPreference">Wind:</label>

    <select id="windPreference" name="windPreference">
        <option th:each="preference : ${windPreferences}"
                th:value="${preference.name()}"
                th:text="${preference.label}"
                th:selected="${preference == windPreference}">
        </option>
    </select>
    <button type="submit">Zeitfenster suchen</button>
    <label for="profileName">Profilname – nur zum Speichern erforderlich:</label>

    <input type="text"
           id="profileName"
           name="profileName"
           maxlength="100"
           th:value="${profileName}"
           placeholder="Zum Beispiel: Meine Fahrradrunde">

    <button type="submit"
            th:formaction="@{/profiles}"
            formmethod="post">
        Suchprofil speichern
    </button>
</form>

<h3 th:text="${'Zeitfenster für: ' + activity.label}"></h3>

<p th:if="${weatherError == null and #lists.isEmpty(suitableWindows)}">
    Für die gewählte Mindestdauer und die aktuellen
    Beispielgrenzen wurden keine passenden Zeitfenster gefunden.
</p>
<p th:text="${'Alle Uhrzeiten gelten für ' + locationName}"></p>
<table>
    <thead>
    <tr>
        <th>Beginn</th>
        <th>Ende</th>
        <th>Dauer in Minuten</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="window : ${suitableWindows}">
        <td th:text="${#temporals.format(window.start(), 'dd.MM.yyyy, HH:mm')}"></td>
        <td th:text="${#temporals.format(window.end(), 'dd.MM.yyyy, HH:mm')}"></td>
        <td th:text="${window.durationMinutes() + ' Min.'}"></td>
    </tr>
    </tbody>
</table>
</body>
</html>
