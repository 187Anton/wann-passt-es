<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Wann passt es?</title>
</head>
<body>
<h1>Wann passt es?</h1>
<p>Finde passende Zeitfenster für deine Outdoor-Aktivitäten.</p>
<h2>Beispielwetter</h2>
<h2>Passende Beispielstunden</h2>
<p>Dies sind feste Beispieldaten, keine aktuelle Wettervorhersage.</p>

<table>
    <thead>
    <tr>
        <th>Zeitpunkt</th>
        <th>Temperatur (°C)</th>
        <th>Wind (km/h)</th>
        <th>Niederschlag (mm)</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="hour : ${suitableHours}">
        <td th:text="${hour.time}"></td>
        <td th:text="${hour.temperatureCelsius}"></td>
        <td th:text="${hour.windKmh}"></td>
        <td th:text="${hour.precipitationMm}"></td>
    </tr>
    </tbody>
</table>
</body>
</html>
