<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Wann passt es?</title>
</head>
<body>
<h2>Wettervorhersage für Berlin</h2>

<p>
    Daten von <a href="https://open-meteo.com/">Open-Meteo</a>.
    Die Bewertung verwendet vorläufige Beispielgrenzen.
</p>

<p th:if="${weatherError != null}"
   th:text="${weatherError}">
</p>

<p th:if="${weatherError == null and #lists.isEmpty(suitableHours)}">
    Für die abgefragten Stunden passt keine Vorhersage
    zu den aktuellen Beispielgrenzen.
</p>

<table>
    <thead>
    <tr>
        <th>Zeitpunkt</th>
        <th>Temperatur (°C)</th>
        <th>Wind (km/h)</th>
        <th>Niederschlag (mm)</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="hour : ${suitableHours}">
        <td th:text="${hour.time}"></td>
        <td th:text="${hour.temperatureCelsius}"></td>
        <td th:text="${hour.windKmh}"></td>
        <td th:text="${hour.precipitationMm}"></td>
    </tr>
    </tbody>
</table>
</body>
</html>
