<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Wann passt es?</title>
</head>
<body>
<h2>Wettervorhersage für Berlin</h2>

<p>
    Daten von <a href="https://open-meteo.com/">Open-Meteo</a>.
    Die Bewertung verwendet vorläufige Beispielgrenzen.
</p>

<p th:if="${weatherError != null}"
   th:text="${weatherError}">
</p>

<p th:if="${weatherError == null and #lists.isEmpty(suitableWindows)}">
    Im abgefragten Zeitraum gibt es keine passenden zukünftigen
    Zeitfenster nach den aktuellen Beispielgrenzen.
</p>

<table>
    <thead>
    <tr>
        <th>Beginn</th>
        <th>Ende</th>
        <th>Dauer in Minuten</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="window : ${suitableWindows}">
        <td th:text="${window.start()}"></td>
        <td th:text="${window.end()}"></td>
        <td th:text="${window.durationMinutes()}"></td>
    </tr>
    </tbody>
</table>
</body>
</html>
