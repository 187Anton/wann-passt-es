<!DOCTYPE html>
<html lang="de" th:replace="~{layout :: page('Planung', 'planning', ~{::content})}">
<body>
<th:block th:fragment="content">
    <div class="page-intro">
        <h1>Wetterplanung</h1>
    </div>

    <div class="planner">
        <section class="panel search-summary" aria-label="Aktuelle Suche">
            <p>
                <strong th:text="${locationName}"></strong>
                <span class="meta" th:text="${selection.activity().label}"></span>
            </p>
            <p class="meta" th:if="${startDate != null}">
                <time th:datetime="${startDate}" th:text="${#temporals.format(startDate, 'dd.MM.yyyy')}"></time>
                <th:block th:if="${endDate != null and endDate != startDate}">
                    <span> bis </span><time th:datetime="${endDate}" th:text="${#temporals.format(endDate, 'dd.MM.yyyy')}"></time>
                </th:block>
            </p>
            <a class="text-button" href="#planning-form">Suche anpassen</a>
        </section>

        <section class="panel results" aria-labelledby="results-title">
            <div class="section-heading">
                <h2 id="results-title">Passende Zeitfenster</h2>
                <p class="meta" th:unless="${#lists.isEmpty(suitableWindows)}"
                   th:text="${#lists.size(suitableWindows) + ' Zeitfenster · Ortszeit'}"></p>
            </div>
            <p th:if="${weatherError}" class="status error" role="alert" th:text="${weatherError}"></p>
            <div th:if="${dateError}" class="status error" id="date-error" role="alert">
                <p th:text="${dateError}"></p>
                <a href="#startDate">Zeitraum ändern</a>
            </div>
            <div th:if="${weatherError == null and dateError == null and #lists.isEmpty(suitableWindows)}" class="status empty">
                <h3>Keine passenden Zeitfenster</h3>
                <p>Versuche eine kürzere Mindestdauer, einen längeren Zeitraum oder weniger strenge Wetterwünsche.</p>
            </div>
            <th:block th:unless="${#lists.isEmpty(suitableWindows)}">
                <th:block th:replace="~{timeline :: days(${timeline})}"></th:block>
            </th:block>
        </section>

        <form id="planning-form" class="panel planning-form" th:action="@{/}" method="get"
              aria-labelledby="planning-title" tabindex="-1">
            <div class="panel-heading">
                <h2 id="planning-title">Suchkriterien</h2>
                <div class="place">
                    <div><span class="meta">Ort</span><strong th:text="${locationName}"></strong></div>
                    <button class="button secondary" type="submit" th:formaction="@{/locations}" formnovalidate>Ort ändern</button>
                </div>
            </div>

            <input type="hidden" name="locationId" th:value="${selection.locationId()}">

            <fieldset class="field-grid">
                <legend>Zeitraum</legend>
                <div class="field">
                    <label for="startDate">Startdatum</label>
                    <input type="date" id="startDate" name="startDate"
                           th:value="${startDate}" th:min="${minSearchDate}" th:max="${maxSearchDate}"
                           th:attr="aria-invalid=${dateError != null ? 'true' : null},
                                    aria-describedby=${dateError != null ? 'date-error' : null}">
                </div>
                <div class="field">
                    <label for="endDate">Enddatum</label>
                    <input type="date" id="endDate" name="endDate"
                           th:value="${endDate}" th:min="${minSearchDate}" th:max="${maxSearchDate}"
                           th:attr="aria-invalid=${dateError != null ? 'true' : null},
                                    aria-describedby=${dateError != null ? 'date-error' : null}">
                </div>
            </fieldset>

            <th:block th:replace="~{fields :: preferences(${selection.activity()}, ${selection.minDurationMinutes()},
                      ${selection.temperaturePreference()}, ${selection.windPreference()}, ${selection.precipitationPreference()})}"></th:block>

            <button class="button primary full-width" type="submit" data-loading="Zeitfenster werden gesucht …">Zeitfenster suchen</button>
            <p class="status loading" data-form-status role="status"></p>

            <fieldset class="save-profile">
                <legend>Suchprofil speichern</legend>
                <p th:if="${profileError}" class="status error" id="profile-error" role="alert" th:text="${profileError}"></p>
                <div class="field">
                    <label for="profileName">Profilname</label>
                    <textarea id="profileName" name="profileName" rows="2" th:text="${profileName}"
                              th:attr="aria-describedby=${profileError != null ? 'profile-error' : null}"></textarea>
                </div>
                <button class="button secondary" type="submit" th:formaction="@{/profiles}" formmethod="post">
                    Suchprofil speichern
                </button>
            </fieldset>
        </form>
    </div>
</th:block>
</body>
</html>
