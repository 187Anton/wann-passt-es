spring.application.name=wann-passt-es
spring.datasource.url=jdbc:h2:file:./data/wann-passt-es;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# The user interface is German only; date and number formatting follow it.
spring.web.locale=de
spring.web.locale-resolver=fixed

